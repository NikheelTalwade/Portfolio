<section class="card">
  <app-section-header
    eyebrow="Experience"
    title="Career timeline"
    description="A track record of building product-focused software across fast-moving teams."
  />

  <div class="timeline">
    @for (item of experience; track item.company) {
      <article class="timeline-item">
        <div class="timeline-marker"></div>
        <div class="timeline-content">
          <div class="timeline-top">
            <h3>{{ item.role }}</h3>
            <span>{{ item.duration }}</span>
          </div>
          <p class="company">{{ item.company }}</p>
          <p class="summary">{{ item.summary }}</p>
          <ul>
            @for (responsibility of item.responsibilities; track responsibility) {
              <li>{{ responsibility }}</li>
            }
          </ul>
          <div class="tech-stack">
            @for (tech of item.technologies; track tech) {
              <span>{{ tech }}</span>
            }
          </div>
        </div>
      </article>
    }
  </div>
</section>
